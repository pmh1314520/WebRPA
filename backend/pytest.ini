[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q -p no:langsmith_plugin
markers =
    unit: 纯逻辑单元测试（无外部依赖）
    contract: 注册表驱动的执行器契约测试
    api: 基于 FastAPI TestClient 的接口自动化测试
    integration: 工作流端到端集成测试（外部依赖 mock/skip）
    regression: 历史缺陷回归用例
